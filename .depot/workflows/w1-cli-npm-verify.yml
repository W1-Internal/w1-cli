name: Verify W1 CLI npm runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    env:
      W1_CLI_VERSION: 0.1.4-next.0
      W1_FINAL_CLI_REF: 3bab1f576754d4331f56787d5df2b44dcde5e137
      W1_HARNESS_REF: a893edf832e8aa4a41d3aa78c3f8057818727fca
    steps:
      - name: Checkout CLI branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout pinned W1 harness
        uses: actions/checkout@v6
        with:
          repository: W1-Internal/w1
          ref: ${{ env.W1_HARNESS_REF }}
          path: .w1-harness
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build pinned runtime bundles
        run: |
          npm ci --prefix .w1-harness
          npm ci --prefix .w1-harness/vscode-extension
          canvas_version=$(node -p 'require("./.w1-harness/node_modules/@napi-rs/canvas/package.json").version')
          npm install --prefix .w1-harness --ignore-scripts --no-save --package-lock=false --force \
            "@napi-rs/canvas-linux-x64-gnu@$canvas_version" \
            "@napi-rs/canvas-linux-x64-musl@$canvas_version" \
            "@napi-rs/canvas-darwin-arm64@$canvas_version" \
            "@napi-rs/canvas-darwin-x64@$canvas_version"
          npm --prefix .w1-harness/vscode-extension run vscode:prepublish
          grep -q 'export async function serve' .w1-harness/scripts/run-stream.ts
          grep -q 'export function installRuntimeSignalHandlers' .w1-harness/scripts/run-stream.ts
          test -s .w1-harness/vscode-extension/out/harness/w1-engine.mjs
          .w1-harness/vscode-extension/node_modules/.bin/esbuild \
            packages/opencode/src/w1/engine.ts \
            --bundle --platform=node --format=esm --target=node18 \
            --outfile=.w1-harness/vscode-extension/out/harness/w1-engine-client.mjs
          mkdir -p .w1-harness/vscode-extension/out/harness/node_modules/@napi-rs
          cp -R \
            .w1-harness/node_modules/@napi-rs/canvas \
            .w1-harness/node_modules/@napi-rs/canvas-linux-x64-gnu \
            .w1-harness/node_modules/@napi-rs/canvas-linux-x64-musl \
            .w1-harness/node_modules/@napi-rs/canvas-darwin-arm64 \
            .w1-harness/node_modules/@napi-rs/canvas-darwin-x64 \
            .w1-harness/vscode-extension/out/harness/node_modules/@napi-rs

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked CLI dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck CLI
        run: bun typecheck

      - name: Run package, tamper, and convergence contracts
        working-directory: packages/opencode
        run: bun test src/w1/auth.test.ts src/w1/runtime.test.ts src/w1/engine.test.ts src/w1/npm-package.test.ts

      - name: Build Linux compiled-host probe
        working-directory: packages/opencode
        env:
          W1_CLI_SOURCE_REF: ${{ github.sha }}
          W1_RUNTIME_BUNDLE_DIR: ${{ github.workspace }}/.w1-harness/vscode-extension/out/harness
        run: |
          bun run script/build.ts --target=linux-x64 --skip-embed-web-ui

      - name: Exercise final packaged compiled host and TUI startup
        working-directory: packages/opencode
        run: |
          binary="$(realpath dist/w1-cli-linux-x64/bin/w1)"
          runtime_dir="$(realpath dist/w1-cli-linux-x64/bin/w1-runtime)"
          W1_COMPILED_BINARY="$binary" \
          W1_COMPILED_ENGINE="$runtime_dir/w1-engine.mjs" \
          W1_COMPILED_RUNTIME="$runtime_dir/run-stream.mjs" \
          bun test src/w1/cli.test.ts --test-name-pattern "packaged compiled host"

      - name: Cross-build libc and macOS packages
        working-directory: packages/opencode
        env:
          W1_CLI_SOURCE_REF: ${{ github.sha }}
          W1_RUNTIME_BUNDLE_DIR: ${{ github.workspace }}/.w1-harness/vscode-extension/out/harness
        run: |
          bun run script/build.ts --target=linux-x64-musl --keep-dist --skip-install --skip-embed-web-ui
          bun run script/build.ts --target=darwin-arm64 --keep-dist --skip-install --skip-embed-web-ui
          bun run script/build.ts --target=darwin-x64 --keep-dist --skip-install --skip-embed-web-ui
          bun run script/build.ts --target=darwin-x64-baseline --keep-dist --skip-install --skip-embed-web-ui

      - name: Stage and verify no-postinstall packages
        working-directory: packages/opencode
        env:
          W1_NPM_ALLOW_PUBLIC_RUNTIME: "1"
          W1_CLI_REF: ${{ github.sha }}
        run: |
          git -C ../.. merge-base --is-ancestor "$W1_FINAL_CLI_REF" "$GITHUB_SHA"
          bun run script/package-w1-npm.ts
          strings dist/w1-cli-darwin-arm64/bin/w1 | grep -F "$GITHUB_SHA"
          test -x dist/npm/w1-cli/bin/w1
          test -s dist/npm/w1-cli-darwin-arm64/w1-runtime-manifest.json
          test -s dist/npm/w1-cli-darwin-arm64/bin/w1-runtime/w1-engine.mjs
          test -s dist/npm/w1-cli-darwin-arm64/bin/w1-runtime/w1-engine-client.mjs
          test -s dist/npm/w1-cli-darwin-arm64/bin/w1-runtime/run-stream.mjs
          test -d dist/npm/w1-cli-darwin-arm64/assets/skills
          test -d dist/npm/w1-cli-darwin-arm64/assets/plugins
          test -d dist/npm/w1-cli-darwin-arm64/bin/w1-runtime/standard_fonts
          test -d dist/npm/w1-cli-darwin-arm64/bin/w1-runtime/node_modules/@napi-rs
          test "$(find dist/npm/w1-cli-darwin-arm64/bin/w1-runtime/node_modules/@napi-rs -name '*.node' -type f | wc -l)" -eq 1
          test "$(find dist/npm/w1-cli-darwin-x64/bin/w1-runtime/node_modules/@napi-rs -name '*.node' -type f | wc -l)" -eq 1
          test "$(find dist/npm/w1-cli-linux-x64/bin/w1-runtime/node_modules/@napi-rs -name '*.node' -type f | wc -l)" -eq 1
          test "$(find dist/npm/w1-cli-linux-x64-musl/bin/w1-runtime/node_modules/@napi-rs -name '*.node' -type f | wc -l)" -eq 1
          test -s dist/npm/w1-cli-darwin-arm64/bin/w1-runtime/node_modules/@napi-rs/canvas-darwin-arm64/skia.darwin-arm64.node
          test -s dist/npm/w1-cli-darwin-x64/bin/w1-runtime/node_modules/@napi-rs/canvas-darwin-x64/skia.darwin-x64.node
          test -s dist/npm/w1-cli-linux-x64/bin/w1-runtime/node_modules/@napi-rs/canvas-linux-x64-gnu/skia.linux-x64-gnu.node
          test -s dist/npm/w1-cli-linux-x64-musl/bin/w1-runtime/node_modules/@napi-rs/canvas-linux-x64-musl/skia.linux-x64-musl.node
          node - <<'NODE'
          const fs = require("node:fs")
          const targets = {
            "w1-cli-darwin-arm64": "bin/w1-runtime/node_modules/@napi-rs/canvas-darwin-arm64/skia.darwin-arm64.node",
            "w1-cli-darwin-x64": "bin/w1-runtime/node_modules/@napi-rs/canvas-darwin-x64/skia.darwin-x64.node",
            "w1-cli-linux-x64": "bin/w1-runtime/node_modules/@napi-rs/canvas-linux-x64-gnu/skia.linux-x64-gnu.node",
            "w1-cli-linux-x64-musl": "bin/w1-runtime/node_modules/@napi-rs/canvas-linux-x64-musl/skia.linux-x64-musl.node",
          }
          for (const [name, expectedPath] of Object.entries(targets)) {
            const manifest = JSON.parse(fs.readFileSync(`dist/npm/${name}/w1-runtime-manifest.json`, "utf8"))
            const nativeEntries = Object.entries(manifest.files).filter(([file]) => file.endsWith(".node"))
            if (nativeEntries.length !== 1 || nativeEntries[0][0] !== expectedPath) process.exit(1)
            const [file, record] = nativeEntries[0]
            if (!/^[0-9a-f]{64}$/.test(record.sha256) || !Number.isSafeInteger(record.bytes) || record.bytes <= 0) process.exit(1)
            if (manifest.build.cli !== process.env.GITHUB_SHA || manifest.build.engine !== process.env.W1_HARNESS_REF) process.exit(1)
            console.log(`W1_NATIVE_MANIFEST ${JSON.stringify({ name, cliRef: manifest.build.cli, engineRef: manifest.build.engine, file, ...record })}`)
          }
          NODE
          file dist/npm/w1-cli-darwin-arm64/bin/w1 | grep -Eq 'Mach-O.*arm64|Mach-O.*ARM64'
          file dist/npm/w1-cli-darwin-x64/bin/w1 | grep -Eq 'Mach-O.*x86_64'
          for package in dist/npm/w1-cli-* dist/npm/w1-cli; do npm pack "$package" --dry-run --json >/dev/null; done

      - name: Pack, install, and run a compiled first actor turn
        working-directory: packages/opencode
        run: |
          test_root="$RUNNER_TEMP/w1-npm-install"
          mkdir -p "$test_root/tarballs" "$test_root/home/.w1" "$test_root/project"
          npm pack dist/npm/w1-cli-linux-x64 --pack-destination "$test_root/tarballs" >/dev/null
          npm pack dist/npm/w1-cli --pack-destination "$test_root/tarballs" >/dev/null
          npm install --prefix "$test_root/prefix" --ignore-scripts \
            "$test_root/tarballs/w1-cli-linux-x64-${W1_CLI_VERSION}.tgz" \
            "$test_root/tarballs/w1-cli-${W1_CLI_VERSION}.tgz"
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({token:"depot-fixture-token",email:"depot@w1.test",telemetryId:null,savedAt:new Date().toISOString()}))' \
            "$test_root/home/.w1/auth.json"
          W1_MOCK_BACKEND_PORT=43171 node script/runtime/mock-w1-backend.mjs >"$test_root/backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            grep -q 'ready:43171' "$test_root/backend.log" && break
            sleep 0.1
          done
          grep -q 'ready:43171' "$test_root/backend.log"
          HOME="$test_root/home" W1_DEV=1 W1_BACKEND_URL=http://127.0.0.1:43171 W1_BACKEND_TOKEN=depot-fixture-token \
            timeout 90 "$test_root/prefix/node_modules/.bin/w1" "$test_root/project" --plain \
              --prompt "Reply once to confirm the packaged actor is running." >"$test_root/actor.log" 2>&1
          grep -q 'Packaged actor turn passed.' "$test_root/actor.log"

      - name: Restage Mac-only dogfood artifact
        working-directory: packages/opencode
        env:
          W1_NPM_ALLOW_PUBLIC_RUNTIME: "1"
          W1_CLI_REF: ${{ github.sha }}
        run: |
          rm -rf dist/w1-cli-linux-* dist/npm
          bun run script/package-w1-npm.ts
          node -e '
            const meta = require("./dist/npm/w1-cli/package.json")
            const names = Object.keys(meta.optionalDependencies || {})
            if (!names.length || names.some((name) => !name.startsWith("w1-cli-darwin-"))) process.exit(1)
          '

      - name: Upload verified package tree
        uses: actions/upload-artifact@v4
        with:
          name: w1-cli-npm-0.1.4-next.0-macos
          path: packages/opencode/dist/npm
          if-no-files-found: error
          retention-days: 7
