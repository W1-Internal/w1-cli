name: Holy Grail TUI (Depot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: W1 product TUI
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck repository
        run: bun typecheck

      - name: Run focused W1 command contracts
        working-directory: packages/opencode
        run: bun test src/w1/cli.test.ts

      - name: Prove W1 and OpenCode keep separate CLI entrypoints
        working-directory: packages/opencode
        run: >-
          bun test
          test/cli/mcp-add.test.ts
          test/cli/help/help-snapshots.test.ts
          test/cli/smokes/read-only.test.ts

      - name: Run focused footer rendering contracts
        working-directory: packages/opencode
        run: >-
          bun test test/cli/run/footer.view.test.tsx
          --test-name-pattern "direct command panel (shows subagent entry|keeps completed subagents available)"

      - name: Run busy footer statusline contract
        working-directory: packages/opencode
        run: >-
          bun test test/cli/run/footer.view.test.tsx
          --test-name-pattern "direct footer shows editable prompts"

      - name: Run responsive footer statusline contract
        working-directory: packages/opencode
        run: >-
          bun test test/cli/run/footer.view.test.tsx
          --test-name-pattern "direct footer separates a lone context hint"

      - name: Run completed-agent footer statusline contract
        working-directory: packages/opencode
        run: >-
          bun test test/cli/run/footer.view.test.tsx
          --test-name-pattern "direct footer hides the subagent hint"

      - name: Run complete footer rendering contracts
        working-directory: packages/opencode
        run: bun test test/cli/run/footer.view.test.tsx

      - name: Run OpenCode package unit suite
        working-directory: packages/opencode
        run: bun test --timeout 30000 --only-failures
