name: Holy Grail TUI (Depot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: W1 Engine-backed product TUI
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Checkout frozen W1 Engine source
        uses: actions/checkout@v4
        with:
          repository: W1-Internal/w1
          ref: 31f4106d8ef1ec4ae6db6667e1991a7a10ea11cb
          path: .w1-engine-source
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build frozen W1 Engine and actor bundle
        run: |
          npm ci --prefix .w1-engine-source
          npm ci --prefix .w1-engine-source/vscode-extension
          npm --prefix .w1-engine-source/vscode-extension run vscode:prepublish
          test -s .w1-engine-source/vscode-extension/out/harness/w1-engine.mjs
          test -s .w1-engine-source/vscode-extension/out/harness/run-stream.mjs
          test -s .w1-engine-source/vscode-extension/out/harness/BUILD_ID

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck repository
        run: bun typecheck

      - name: Run focused W1 command contracts
        working-directory: packages/opencode
        run: bun test src/w1/auth.test.ts src/w1/runtime.test.ts src/w1/engine.test.ts src/w1/tui-contract.test.ts src/w1/cli.test.ts

      - name: Prove W1 and OpenCode keep separate CLI entrypoints
        working-directory: packages/opencode
        run: >-
          bun test
          test/cli/mcp-add.test.ts
          test/cli/help/help-snapshots.test.ts
          test/cli/smokes/read-only.test.ts

      - name: Prove OpenCode subprocess runtime remains intact
        working-directory: packages/opencode
        # Latest main has one known red timing assertion in this file: the 15s subprocess
        # timeout is measured as >15s after cleanup overhead (Depot baseline jcxjmlp1hk).
        run: >-
          bun test test/cli/run/run-process.test.ts
          --test-name-pattern "^(?!.*exits nonzero promptly when the model is unknown).*"

      - name: Run focused footer rendering contracts
        working-directory: packages/opencode
        run: >-
          bun test test/cli/run/footer.view.test.tsx
          --test-name-pattern "direct command panel (shows subagent entry|keeps completed subagents available)"

      - name: Run busy footer statusline contract
        working-directory: packages/opencode
        run: >-
          bun test test/cli/run/footer.view.test.tsx
          --test-name-pattern "direct footer shows editable prompts"

      - name: Run responsive footer statusline contract
        working-directory: packages/opencode
        run: >-
          bun test test/cli/run/footer.view.test.tsx
          --test-name-pattern "direct footer separates a lone context hint"

      - name: Run completed-agent footer statusline contract
        working-directory: packages/opencode
        run: >-
          bun test test/cli/run/footer.view.test.tsx
          --test-name-pattern "direct footer hides the subagent hint"

      - name: Run complete footer rendering contracts
        working-directory: packages/opencode
        run: bun test test/cli/run/footer.view.test.tsx

      - name: Build native Linux W1 CLI with frozen Engine
        working-directory: packages/opencode
        env:
          W1_RUNTIME_BUNDLE_DIR: ${{ github.workspace }}/.w1-engine-source/vscode-extension/out/harness
        run: bun run script/build.ts --target=linux-x64 --skip-embed-web-ui

      - name: Exercise packaged compiled host, actor approval, yolo, and reconnect
        working-directory: packages/opencode
        run: |
          binary="$(realpath dist/w1-cli-linux-x64/bin/w1)"
          runtime_dir="$(realpath dist/w1-cli-linux-x64/bin/w1-runtime)"
          test -x "$binary"
          W1_COMPILED_BINARY="$binary" \
          W1_COMPILED_ENGINE="$runtime_dir/w1-engine.mjs" \
          W1_COMPILED_RUNTIME="$runtime_dir/run-stream.mjs" \
          bun test src/w1/cli.test.ts --test-name-pattern "packaged compiled host"

      - name: Cross-build macOS arm64 W1 CLI with frozen Engine
        working-directory: packages/opencode
        env:
          W1_RUNTIME_BUNDLE_DIR: ${{ github.workspace }}/.w1-engine-source/vscode-extension/out/harness
        run: bun run script/build.ts --target=darwin-arm64 --skip-embed-web-ui

      - name: Verify product entrypoints and bundled daemon
        run: |
          bin_dir="$(find packages/opencode/dist -maxdepth 2 -type d -path '*/w1-cli-darwin-*/bin' -print -quit)"
          test -n "$bin_dir"
          test -x "$bin_dir/w1"
          test -s "$bin_dir/w1-runtime/w1-engine.mjs"
          test -s "$bin_dir/w1-runtime/run-stream.mjs"
          test -s "$bin_dir/w1-runtime/BUILD_ID"
          file "$bin_dir/w1" | grep -Eq 'Mach-O.*arm64|Mach-O.*ARM64'
