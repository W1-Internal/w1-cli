name: Holy Grail CLI Dogfood Artifacts

on:
  workflow_dispatch:

concurrency:
  group: holy-grail-cli-dogfood-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  W1_CLI_VERSION: 0.1.6-dogfood.1
  W1_ENGINE_REF: 31f4106d8ef1ec4ae6db6667e1991a7a10ea11cb

jobs:
  cross-platform:
    name: Cross-platform CLI packages
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Holy Grail engine
        uses: actions/checkout@v4
        with:
          repository: W1-Internal/w1
          ref: ${{ env.W1_ENGINE_REF }}
          path: .w1-engine-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build multi-platform engine bundle
        working-directory: .w1-engine-source
        run: |
          npm ci
          npm install --no-save --ignore-scripts --force \
            @napi-rs/canvas-darwin-arm64@0.1.100 \
            @napi-rs/canvas-win32-x64-msvc@0.1.100
          npm ci --prefix vscode-extension
          npm --prefix vscode-extension run vscode:prepublish
          test "$(cat vscode-extension/out/harness/BUILD_ID)" = "$W1_ENGINE_REF"
          test -s vscode-extension/out/harness/node_modules/@napi-rs/canvas-darwin-arm64/skia.darwin-arm64.node
          test -s vscode-extension/out/harness/node_modules/@napi-rs/canvas-win32-x64-msvc/skia.win32-x64-msvc.node
      - name: Install locked CLI dependencies
        run: bun install --frozen-lockfile
      - name: Cross-build Mac and Windows CLIs
        working-directory: packages/opencode
        env:
          W1_RUNTIME_BUNDLE_DIR: ${{ github.workspace }}/.w1-engine-source/vscode-extension/out/harness
        run: |
          bun run script/build.ts --target=darwin-arm64 --skip-embed-web-ui
          bun run script/build.ts --target=windows-x64 --skip-embed-web-ui --keep-dist
      - name: Verify exact engine, Canvas, skills, binaries, and archives
        run: |
          check_file() { test -s "$1" || { echo "missing or empty: $1" >&2; return 1; }; echo "verified: $1"; }
          mac="packages/opencode/dist/w1-cli-darwin-arm64"
          win="packages/opencode/dist/w1-cli-windows-x64"
          check_file "$mac/bin/w1"
          win_binary="$(find "$win/bin" -maxdepth 1 -type f \( -name w1 -o -name w1.exe \) -print -quit)"
          test -n "$win_binary" || { echo "Windows binary missing" >&2; find "$win" -maxdepth 4 -type f -print; exit 1; }
          check_file "$win_binary"
          test "$(cat "$mac/bin/w1-runtime/BUILD_ID")" = "$W1_ENGINE_REF"
          test "$(cat "$win/bin/w1-runtime/BUILD_ID")" = "$W1_ENGINE_REF"
          check_file "$mac/bin/w1-runtime/node_modules/@napi-rs/canvas-darwin-arm64/skia.darwin-arm64.node"
          check_file "$win/bin/w1-runtime/node_modules/@napi-rs/canvas-win32-x64-msvc/skia.win32-x64-msvc.node"
          check_file "$mac/assets/skills/security/SKILL.md"
          check_file "$win/assets/skills/security/SKILL.md"
          file "$mac/bin/w1"
          file "$win_binary"
          file "$mac/bin/w1" | grep -Eq 'Mach-O.*arm64|Mach-O.*ARM64'
          file "$win_binary" | grep -Eq 'PE32\+?.*x86-64|PE32\+?.*Intel 80386'
          (cd packages/opencode/dist && zip -qr "$GITHUB_WORKSPACE/w1-cli-$W1_CLI_VERSION-mac-arm64.zip" w1-cli-darwin-arm64)
          (cd packages/opencode/dist && zip -qr "$GITHUB_WORKSPACE/w1-cli-$W1_CLI_VERSION-windows-x64.zip" w1-cli-windows-x64)
          sha256sum w1-cli-*.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: w1-cli-${{ env.W1_CLI_VERSION }}-mac-and-windows
          path: |
            w1-cli-${{ env.W1_CLI_VERSION }}-mac-arm64.zip
            w1-cli-${{ env.W1_CLI_VERSION }}-windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
