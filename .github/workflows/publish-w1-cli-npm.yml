name: Publish W1 CLI to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact immutable semver to stage or publish
        required: true
        type: string
      harness_ref:
        description: Exact W1 engine commit to bundle
        required: true
        type: string
      publish:
        description: Publish verified packages and promote them to latest
        required: true
        default: false
        type: boolean
      allow_public_runtime:
        description: I approve publishing the bundled W1 runtime inside the public native packages
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-w1-cli-npm-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Verify and stage cross-platform npm packages
    if: ${{ inputs.allow_public_runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact W1 CLI source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate immutable release inputs
        env:
          VERSION: ${{ inputs.version }}
          HARNESS_REF: ${{ inputs.harness_ref }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Version must be exact semver" >&2
            exit 1
          }
          [[ "$HARNESS_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Harness ref must be an exact 40-character commit" >&2
            exit 1
          }

      - name: Checkout exact private W1 engine source
        uses: actions/checkout@v6
        with:
          repository: W1-Internal/w1
          ref: ${{ inputs.harness_ref }}
          path: .w1-harness
          token: ${{ secrets.W1_HARNESS_READ_TOKEN }}
          persist-credentials: false

      - name: Build exact multi-platform W1 runtime
        working-directory: .w1-harness
        env:
          HARNESS_REF: ${{ inputs.harness_ref }}
        run: |
          npm ci
          npm install --no-save --ignore-scripts --force \
            @napi-rs/canvas-darwin-arm64@0.1.100 \
            @napi-rs/canvas-darwin-x64@0.1.100 \
            @napi-rs/canvas-win32-x64-msvc@0.1.100
          npm ci --prefix vscode-extension
          npm --prefix vscode-extension run vscode:prepublish
          test "$(cat vscode-extension/out/harness/BUILD_ID)" = "$HARNESS_REF"
          test -s vscode-extension/out/harness/run-stream.mjs

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked CLI dependencies
        run: bun install --frozen-lockfile

      - name: Run full CLI typecheck
        run: bun typecheck

      - name: Run W1 package and release contracts
        working-directory: packages/opencode
        run: >-
          bun test
          src/w1/auth.test.ts
          src/w1/runtime.test.ts
          src/w1/cli.test.ts
          src/w1/npm-package.test.ts
          src/w1/npm-release-workflow.test.ts

      - name: Cross-build Mac and Windows native packages
        working-directory: packages/opencode
        env:
          W1_CLI_VERSION: ${{ inputs.version }}
          W1_RUNTIME_BUNDLE_DIR: ${{ github.workspace }}/.w1-harness/vscode-extension/out/harness
        run: |
          bun run script/build.ts --target=darwin-arm64 --skip-embed-web-ui
          bun run script/build.ts --target=darwin-x64 --keep-dist --skip-install --skip-embed-web-ui
          bun run script/build.ts --target=darwin-x64-baseline --keep-dist --skip-install --skip-embed-web-ui
          bun run script/build.ts --target=windows-x64 --keep-dist --skip-install --skip-embed-web-ui

      - name: Stage fail-closed npm package tree
        working-directory: packages/opencode
        env:
          W1_NPM_ALLOW_PUBLIC_RUNTIME: "1"
        run: bun run script/package-w1-npm.ts

      - name: Verify exact engine, binaries, runtime, assets, and package manifests
        working-directory: packages/opencode
        env:
          HARNESS_REF: ${{ inputs.harness_ref }}
        run: |
          mac="dist/npm/w1-cli-darwin-arm64"
          win="dist/npm/w1-cli-windows-x64"
          test -x dist/npm/w1-cli/bin/w1
          test -x "$mac/bin/w1"
          test -s "$win/bin/w1.exe"
          test "$(cat "$mac/bin/w1-runtime/BUILD_ID")" = "$HARNESS_REF"
          test "$(cat "$win/bin/w1-runtime/BUILD_ID")" = "$HARNESS_REF"
          test -s "$mac/bin/w1-runtime/run-stream.mjs"
          test -s "$win/bin/w1-runtime/run-stream.mjs"
          test -s "$mac/assets/skills/security/SKILL.md"
          test -s "$win/assets/skills/security/SKILL.md"
          file "$mac/bin/w1" | grep -q 'Mach-O 64-bit arm64 executable'
          file "$win/bin/w1.exe" | grep -Eq 'PE32\+ executable.*x86-64'
          # Pack once, under a deterministic name, and publish exactly these bytes later. npm derives
          # its own tarball name from the scoped package name, so rename to the staging directory name
          # to keep build and publish referring to the same artifact.
          mkdir -p dist/npm-packed
          for package in dist/npm/w1-cli-* dist/npm/w1-cli; do
            name="$(basename "$package")"
            packed="$(npm pack "$package" --pack-destination dist/npm-packed --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)[0].filename))')"
            mv "dist/npm-packed/$packed" "dist/npm-packed/$name.tgz"
          done
          # Record bare filenames so the manifest verifies from whatever directory it is transported
          # into. sha256sum stores paths verbatim, and the publish job checks from inside the folder.
          ( cd dist/npm-packed && sha256sum *.tgz > SHA256SUMS.txt )

      - name: Reject unsafe tarball contents
        working-directory: packages/opencode
        run: |
          set -euo pipefail
          for tarball in dist/npm-packed/*.tgz; do
            echo "Auditing $tarball"
            # Symlinks and hardlinks can escape the package root on extraction.
            if tar -tvzf "$tarball" | grep -Eq '^[lh]'; then
              echo "Refusing tarball with links: $tarball" >&2; exit 1
            fi
            while read -r entry; do
              case "$entry" in
                package/bin/*|package/assets/*|package/package.json|package/LICENSE|package/) ;;
                *) echo "Unexpected file in $tarball: $entry" >&2; exit 1 ;;
              esac
            done < <(tar -tzf "$tarball")
            if tar -tzf "$tarball" | grep -Eq '\.(map|pem|key|p12|pfx)$|(^|/)\.(npmrc|env|netrc|git)|(^|/)id_rsa|(^|/)auth\.json$'; then
              echo "Refusing tarball with credential or sourcemap content: $tarball" >&2; exit 1
            fi
          done

      - name: Upload staged npm packages
        uses: actions/upload-artifact@v4
        with:
          name: w1-cli-npm-${{ inputs.version }}-mac-windows
          path: |
            packages/opencode/dist/npm
            packages/opencode/dist/npm-packed
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish immutable packages and promote latest
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      W1_NPM_ALLOW_PUBLIC_RUNTIME: ${{ inputs.allow_public_runtime && '1' || '0' }}
      NODE_AUTH_TOKEN: ${{ secrets.W1_NPM_TOKEN }}
    steps:
      - name: Download verified package tree
        uses: actions/download-artifact@v4
        with:
          name: w1-cli-npm-${{ inputs.version }}-mac-windows
          path: release

      - name: Set up Node and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Require authorized unpublished packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$W1_NPM_ALLOW_PUBLIC_RUNTIME" = "1" || {
            echo "Public W1 runtime exposure was not approved" >&2
            exit 1
          }
          npm whoami >/dev/null
          for package in @w1-lab/cli-darwin-arm64 @w1-lab/cli-darwin-x64 @w1-lab/cli-darwin-x64-baseline @w1-lab/cli-windows-x64 @w1-lab/cli; do
            if npm view "$package@$VERSION" version >/dev/null 2>&1; then
              echo "Refusing to overwrite existing $package@$VERSION" >&2
              exit 1
            fi
          done

      - name: Verify transported tarballs match the bytes CI packed
        run: |
          set -euo pipefail
          cd release/npm-packed
          sha256sum --check SHA256SUMS.txt

      - name: Publish native packages before the meta package
        run: |
          set -euo pipefail
          # Publish the exact verified tarballs. Publishing directories would ship bytes that were
          # never checksummed, and would depend on executable modes that artifact transport drops.
          npm publish release/npm-packed/w1-cli-darwin-arm64.tgz --access public --tag next --provenance
          npm publish release/npm-packed/w1-cli-darwin-x64.tgz --access public --tag next --provenance
          npm publish release/npm-packed/w1-cli-darwin-x64-baseline.tgz --access public --tag next --provenance
          npm publish release/npm-packed/w1-cli-windows-x64.tgz --access public --tag next --provenance
          npm publish release/npm-packed/w1-cli.tgz --access public --tag next --provenance

      - name: Verify registry contents before promotion
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for package in @w1-lab/cli-darwin-arm64 @w1-lab/cli-darwin-x64 @w1-lab/cli-darwin-x64-baseline @w1-lab/cli-windows-x64 @w1-lab/cli; do
            test "$(npm view "$package@$VERSION" version)" = "$VERSION"
          done
          # The published meta package must only depend on names inside the owned scope.
          npm view "@w1-lab/cli@$VERSION" optionalDependencies --json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const o=JSON.parse(s||"{}");const bad=Object.keys(o).filter(n=>!n.startsWith("@w1-lab/"));if(bad.length){console.error("Unscoped dependency published: "+bad.join(", "));process.exit(1)}})'

      - name: Promote the verified release to latest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm dist-tag add @w1-lab/cli-darwin-arm64@"$VERSION" latest
          npm dist-tag add @w1-lab/cli-darwin-x64@"$VERSION" latest
          npm dist-tag add @w1-lab/cli-darwin-x64-baseline@"$VERSION" latest
          npm dist-tag add @w1-lab/cli-windows-x64@"$VERSION" latest
          npm dist-tag add @w1-lab/cli@"$VERSION" latest
          test "$(npm view @w1-lab/cli dist-tags.latest)" = "$VERSION"
