name: Publish W1 CLI to npm (macOS next)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semver to publish to the npm next tag
        required: true
        type: string
      harness_ref:
        description: Exact W1 harness commit containing the runtime to bundle
        required: true
        type: string
      allow_public_runtime:
        description: I approve publishing the bundled W1 runtime source inside the public native npm packages
        required: true
        default: false
        type: boolean
      publish:
        description: Publish after Depot validation (leave false for dogfood build artifacts)
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-w1-cli-npm-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Cross-build and stage macOS npm packages on Depot
    if: ${{ inputs.allow_public_runtime }}
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 45
    steps:
      - name: Checkout exact W1 CLI source
        uses: actions/checkout@v6

      - name: Validate immutable release inputs
        env:
          VERSION: ${{ inputs.version }}
          HARNESS_REF: ${{ inputs.harness_ref }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Version must be exact semver" >&2
            exit 1
          }
          [[ "$HARNESS_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Harness ref must be an exact 40-character commit" >&2
            exit 1
          }

      - name: Checkout exact private W1 runtime source
        uses: actions/checkout@v6
        with:
          repository: W1-Internal/w1
          ref: ${{ inputs.harness_ref }}
          path: .w1-harness
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build W1 runtime bundle
        working-directory: .w1-harness
        run: |
          npm ci
          npm ci --prefix vscode-extension
          canvas_version=$(node -p 'require("./node_modules/@napi-rs/canvas/package.json").version')
          npm install --ignore-scripts --no-save --package-lock=false --force \
            "@napi-rs/canvas-linux-x64-gnu@$canvas_version" \
            "@napi-rs/canvas-linux-x64-musl@$canvas_version" \
            "@napi-rs/canvas-darwin-arm64@$canvas_version" \
            "@napi-rs/canvas-darwin-x64@$canvas_version"
          npm --prefix vscode-extension run vscode:prepublish
          test -s vscode-extension/out/harness/run-stream.mjs
          test -s vscode-extension/out/harness/w1-engine.mjs
          test -s vscode-extension/out/harness/BUILD_ID

      - name: Build npm engine and client entrypoints
        run: |
          mkdir -p .w1-harness/scripts/npm
          cp packages/opencode/script/runtime/w1-engine-entry.ts.txt .w1-harness/scripts/npm/w1-engine-entry.ts
          grep -q 'export async function serve' .w1-harness/scripts/run-stream.ts
          grep -q 'export function installRuntimeSignalHandlers' .w1-harness/scripts/run-stream.ts
          .w1-harness/vscode-extension/node_modules/.bin/esbuild \
            .w1-harness/scripts/npm/w1-engine-entry.ts \
            --bundle --platform=node --format=esm --target=node18 \
            --external:@napi-rs/canvas \
            --outfile=.w1-harness/vscode-extension/out/harness/w1-engine.mjs
          .w1-harness/vscode-extension/node_modules/.bin/esbuild \
            packages/opencode/src/w1/engine.ts \
            --bundle --platform=node --format=esm --target=node18 \
            --outfile=.w1-harness/vscode-extension/out/harness/w1-engine-client.mjs
          mkdir -p .w1-harness/vscode-extension/out/harness/node_modules/@napi-rs
          cp -R \
            .w1-harness/node_modules/@napi-rs/canvas \
            .w1-harness/node_modules/@napi-rs/canvas-linux-x64-gnu \
            .w1-harness/node_modules/@napi-rs/canvas-linux-x64-musl \
            .w1-harness/node_modules/@napi-rs/canvas-darwin-arm64 \
            .w1-harness/node_modules/@napi-rs/canvas-darwin-x64 \
            .w1-harness/vscode-extension/out/harness/node_modules/@napi-rs
          test -s .w1-harness/vscode-extension/out/harness/w1-engine.mjs
          test -s .w1-harness/vscode-extension/out/harness/w1-engine-client.mjs

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked CLI dependencies
        run: bun install --frozen-lockfile

      - name: Run full CLI typecheck
        run: bun typecheck

      - name: Run W1 package contracts
        working-directory: packages/opencode
        run: bun test src/w1/auth.test.ts src/w1/runtime.test.ts src/w1/engine.test.ts src/w1/npm-package.test.ts

      - name: Build macOS native packages
        working-directory: packages/opencode
        env:
          W1_CLI_VERSION: ${{ inputs.version }}
          W1_RUNTIME_BUNDLE_DIR: ${{ github.workspace }}/.w1-harness/vscode-extension/out/harness
        run: |
          bun run script/build.ts --target=linux-x64 --skip-embed-web-ui
          bun run script/build.ts --target=linux-x64-musl --keep-dist --skip-install --skip-embed-web-ui
          bun run script/build.ts --target=darwin-arm64 --keep-dist --skip-install --skip-embed-web-ui
          bun run script/build.ts --target=darwin-x64 --keep-dist --skip-install --skip-embed-web-ui
          bun run script/build.ts --target=darwin-x64-baseline --keep-dist --skip-install --skip-embed-web-ui

      - name: Pack, install, and run a compiled first actor turn
        working-directory: packages/opencode
        env:
          W1_NPM_ALLOW_PUBLIC_RUNTIME: "1"
          W1_CLI_REF: ${{ github.sha }}
          W1_HARNESS_REF: ${{ inputs.harness_ref }}
          W1_CLI_VERSION: ${{ inputs.version }}
        run: |
          bun run script/package-w1-npm.ts --output=dist/npm-e2e
          test_root="$RUNNER_TEMP/w1-npm-install"
          mkdir -p "$test_root/tarballs" "$test_root/home/.w1" "$test_root/project"
          npm pack dist/npm-e2e/w1-cli-linux-x64 --pack-destination "$test_root/tarballs" >/dev/null
          npm pack dist/npm-e2e/w1-cli --pack-destination "$test_root/tarballs" >/dev/null
          npm install --prefix "$test_root/prefix" --ignore-scripts \
            "$test_root/tarballs/w1-cli-linux-x64-${W1_CLI_VERSION}.tgz" \
            "$test_root/tarballs/w1-cli-${W1_CLI_VERSION}.tgz"
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({token:"depot-fixture-token",email:"depot@w1.test",telemetryId:null,savedAt:new Date().toISOString()}))' \
            "$test_root/home/.w1/auth.json"
          W1_MOCK_BACKEND_PORT=43171 node script/runtime/mock-w1-backend.mjs >"$test_root/backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            grep -q 'ready:43171' "$test_root/backend.log" && break
            sleep 0.1
          done
          grep -q 'ready:43171' "$test_root/backend.log"
          HOME="$test_root/home" W1_DEV=1 W1_BACKEND_URL=http://127.0.0.1:43171 W1_BACKEND_TOKEN=depot-fixture-token \
            timeout 90 "$test_root/prefix/node_modules/.bin/w1" "$test_root/project" --plain \
              --prompt "Reply once to confirm the packaged actor is running." >"$test_root/actor.log" 2>&1
          grep -q 'Packaged actor turn passed.' "$test_root/actor.log"
          rm -rf dist/w1-cli-linux-* dist/npm-e2e

      - name: Stage fail-closed npm package tree
        working-directory: packages/opencode
        env:
          W1_NPM_ALLOW_PUBLIC_RUNTIME: "1"
          W1_CLI_REF: ${{ github.sha }}
          W1_HARNESS_REF: ${{ inputs.harness_ref }}
        run: bun run script/package-w1-npm.ts

      - name: Verify staged package contracts
        working-directory: packages/opencode
        run: |
          test -x dist/npm/w1-cli/bin/w1
          test -x dist/npm/w1-cli-darwin-arm64/bin/w1
          test -x dist/npm/w1-cli-darwin-x64/bin/w1
          test -x dist/npm/w1-cli-darwin-x64-baseline/bin/w1
          test -s dist/npm/w1-cli-darwin-arm64/bin/w1-runtime/run-stream.mjs
          test -s dist/npm/w1-cli-darwin-arm64/bin/w1-runtime/w1-engine.mjs
          test -s dist/npm/w1-cli-darwin-arm64/bin/w1-runtime/w1-engine-client.mjs
          test -s dist/npm/w1-cli-darwin-arm64/w1-runtime-manifest.json
          test -d dist/npm/w1-cli-darwin-arm64/assets/skills
          test -d dist/npm/w1-cli-darwin-arm64/assets/plugins
          test "$(find dist/npm/w1-cli-darwin-arm64/bin/w1-runtime/node_modules/@napi-rs -name '*.node' -type f | wc -l)" -eq 1
          test "$(find dist/npm/w1-cli-darwin-x64/bin/w1-runtime/node_modules/@napi-rs -name '*.node' -type f | wc -l)" -eq 1
          test -s dist/npm/w1-cli-darwin-arm64/bin/w1-runtime/node_modules/@napi-rs/canvas-darwin-arm64/skia.darwin-arm64.node
          test -s dist/npm/w1-cli-darwin-x64/bin/w1-runtime/node_modules/@napi-rs/canvas-darwin-x64/skia.darwin-x64.node
          file dist/npm/w1-cli-darwin-arm64/bin/w1 | grep -Eq 'Mach-O.*arm64|Mach-O.*ARM64'
          file dist/npm/w1-cli-darwin-x64/bin/w1 | grep -Eq 'Mach-O.*x86_64'
          for package in dist/npm/w1-cli-* dist/npm/w1-cli; do npm pack "$package" --dry-run --json >/dev/null; done

      - name: Upload staged npm packages
        uses: actions/upload-artifact@v4
        with:
          name: w1-cli-npm-${{ inputs.version }}-macos
          path: packages/opencode/dist/npm
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable packages with npm OIDC
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-next
    env:
      W1_NPM_ALLOW_PUBLIC_RUNTIME: ${{ inputs.allow_public_runtime && '1' || '0' }}
    steps:
      - name: Download staged packages
        uses: actions/download-artifact@v4
        with:
          name: w1-cli-npm-${{ inputs.version }}-macos
          path: npm

      - name: Set up Node and npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require an unpublished immutable version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$W1_NPM_ALLOW_PUBLIC_RUNTIME" = "1" || {
            echo "Public W1 runtime exposure was not approved" >&2
            exit 1
          }
          for package in w1-cli-darwin-arm64 w1-cli-darwin-x64 w1-cli-darwin-x64-baseline w1-cli; do
            if npm view "$package@$VERSION" version >/dev/null 2>&1; then
              echo "Refusing to overwrite existing $package@$VERSION" >&2
              exit 1
            fi
          done

      - name: Restore executable modes lost in artifact transport
        run: |
          chmod 755 npm/w1-cli/bin/w1
          chmod 755 npm/w1-cli-darwin-arm64/bin/w1
          chmod 755 npm/w1-cli-darwin-x64/bin/w1
          chmod 755 npm/w1-cli-darwin-x64-baseline/bin/w1

      - name: Publish native packages before the meta package
        run: |
          npm publish npm/w1-cli-darwin-arm64 --access public --tag next --provenance
          npm publish npm/w1-cli-darwin-x64 --access public --tag next --provenance
          npm publish npm/w1-cli-darwin-x64-baseline --access public --tag next --provenance
          npm publish npm/w1-cli --access public --tag next --provenance
